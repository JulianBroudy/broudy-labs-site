<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Broudy Labs</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages shows this page for any missing path, at any depth, so relative links do not work here.
     The style is inline. The small inline script finds the site root (the github.io project path or the custom domain). -->
<style>
  :root{--paper:#E7EEEA;--ink:#14211F;--muted:#566964;--coral:#FF5E4A;--coral-edge:#C23C2B;--chip:#D9E3DE;--chip-edge:rgba(20,33,31,.16);color-scheme:light}
  @media (prefers-color-scheme: dark){:root{--paper:#0D1615;--ink:#E4EDE9;--muted:#8EA29D;--coral:#FF6E5A;--coral-edge:#A93727;--chip:#1F2E2C;--chip-edge:rgba(0,0,0,.45);color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:72px 16px}
  .mark{width:40px;height:40px;border-radius:11px;background:var(--coral);box-shadow:inset 0 -5px 0 var(--coral-edge);transform:rotate(-8deg);margin-bottom:20px}
  h1{font:400 clamp(30px,8vw,40px)/1.15 "Lilita One","Arial Rounded MT Bold",sans-serif;margin:0 0 10px}
  p{margin:0 0 18px;color:var(--muted)}
  a.btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px 11px;border-radius:14px;background:var(--chip);box-shadow:inset 0 -4px 0 var(--chip-edge);color:var(--ink);text-decoration:none;font-weight:700}
  a.btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"></div>
<h1>This page is not here</h1>
<p>The link may be old, or the address may have a typing error.</p>
<p><a class="btn" id="home" href="/">Go to Broudy Labs</a></p>
</main>
<script>
  (function () {
    var p = location.pathname;
    var root = p.indexOf('/broudy-labs-site/') === 0 || p === '/broudy-labs-site' ? '/broudy-labs-site/' : '/';
    document.getElementById('home').setAttribute('href', root);
    var f = root + 'assets/fonts/', s = document.createElement('style');
    s.textContent = '@font-face{font-family:"Lilita One";font-display:swap;src:url(' + f + 'lilita-one-latin-400-normal.woff2) format("woff2")}' +
      '@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(' + f + 'figtree-latin-400-normal.woff2) format("woff2")}' +
      '@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(' + f + 'figtree-latin-700-normal.woff2) format("woff2")}';
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
